<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mensajes" />
  <title>Lector WhatsApp</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 30px 0 10px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: #8b949e;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    /* Mic button */
    #mic-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: #21262d;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px auto;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    #mic-btn:active { transform: scale(0.95); }
    #mic-btn.listening { background: #1f4f23; animation: pulse 1.4s infinite; }
    #mic-btn.speaking  { background: #1a3a5c; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56, 211, 72, 0.4); }
      50%       { box-shadow: 0 0 0 18px rgba(56, 211, 72, 0); }
    }

    #mic-icon { font-size: 2.6rem; }

    /* Status */
    #status {
      font-size: 0.95rem;
      color: #8b949e;
      text-align: center;
      min-height: 22px;
      margin-bottom: 10px;
    }

    #status.active   { color: #3fb950; }
    #status.speaking { color: #58a6ff; }
    #status.error    { color: #f85149; }

    /* Transcript */
    #transcript-box {
      width: 100%;
      max-width: 480px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.9rem;
      color: #8b949e;
      min-height: 42px;
      margin-bottom: 24px;
    }

    /* Messages list */
    .section-title {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .section-title span { font-size: 1rem; font-weight: 600; }

    .badge {
      background: #f85149;
      color: #fff;
      border-radius: 99px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    #messages-list {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .msg-card.read { opacity: 0.45; }

    .msg-info { flex: 1; }

    .msg-sender {
      font-size: 0.85rem;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 4px;
    }

    .msg-text {
      font-size: 0.9rem;
      color: #c9d1d9;
      line-height: 1.4;
    }

    .msg-time {
      font-size: 0.75rem;
      color: #8b949e;
      white-space: nowrap;
      padding-top: 2px;
    }

    /* QR banner */
    #qr-banner {
      display: none;
      width: 100%;
      max-width: 480px;
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    #qr-banner p { font-size: 0.85rem; color: #8b949e; margin-bottom: 10px; }
    #qr-banner a {
      display: inline-block;
      background: #25d366;
      color: #000;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
    }

    footer {
      margin-top: 30px;
      color: #484f58;
      font-size: 0.75rem;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>💬 Lector WhatsApp</h1>
  <p>Di <strong>"mensaje"</strong> para escuchar tus pendientes</p>
  <div id="wa-status" style="margin-top:10px;font-size:0.8rem;padding:6px 14px;border-radius:20px;display:inline-block;background:#21262d;color:#8b949e">
    ⏳ Conectando…
  </div>
</header>

<button id="mic-btn" title="Activar/desactivar escucha">
  <span id="mic-icon">🎤</span>
</button>

<div id="status">Presioná el micrófono para empezar</div>
<div id="transcript-box">…</div>

<div class="section-title">
  <span>Mensajes pendientes</span>
  <span class="badge" id="count">0</span>
</div>

<div id="qr-banner">
  <p>WhatsApp no está conectado. Escaneá el QR para vincular tu cuenta.</p>
  <a id="qr-link" href="#" target="_blank">📷 Abrir QR para escanear</a>
</div>

<div id="messages-list"></div>

<footer>WhatsApp vía Baileys · Agregá a pantalla de inicio para acceso rápido</footer>

<script>
  // ── Config ─────────────────────────────────────────────────────────────────
  // El backend sirve tanto la app como la API en el mismo origen
  const API = window.location.origin;

  // ── State ──────────────────────────────────────────────────────────────────
  let messages = [];
  let listening = false;
  let recognition = null;
  let synth = window.speechSynthesis;

  // ── Backend polling ────────────────────────────────────────────────────────
  async function fetchStatus() {
    try {
      const r = await fetch(API + '/api/status');
      const data = await r.json();
      const el = document.getElementById('wa-status');
      const banner = document.getElementById('qr-banner');
      if (data.connected) {
        el.style.background = '#1f4f23';
        el.style.color = '#3fb950';
        el.textContent = '✅ WhatsApp conectado';
        banner.style.display = 'none';
      } else if (data.hasQr) {
        el.style.background = '#2d2208';
        el.style.color = '#e3b341';
        el.textContent = '📷 Esperando escaneo QR';
        banner.style.display = 'block';
        document.getElementById('qr-link').href = API + '/qr';
      } else {
        el.style.background = '#21262d';
        el.style.color = '#8b949e';
        el.textContent = '⏳ Conectando a WhatsApp…';
        banner.style.display = 'none';
      }
    } catch {
      const el = document.getElementById('wa-status');
      el.style.background = '#3d1010';
      el.style.color = '#f85149';
      el.textContent = '⚠ Servidor offline';
    }
  }

  async function fetchMessages() {
    try {
      const r = await fetch(API + '/api/messages');
      const data = await r.json();
      messages = data.messages || [];
      render();
    } catch {
      // servidor offline, mantenemos los mensajes anteriores
    }
  }

  async function markRead(id) {
    try {
      await fetch(API + '/api/messages/read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
      });
    } catch {}
    const msg = messages.find(m => m.id === id);
    if (msg) msg.read = true;
    render();
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function render() {
    const list = document.getElementById('messages-list');
    const pending = messages.filter(m => !m.read);
    document.getElementById('count').textContent = pending.length;
    list.innerHTML = '';

    if (messages.length === 0) {
      list.innerHTML = '<p style="color:#484f58;font-size:0.85rem;text-align:center;padding:16px 0">Sin mensajes todavía</p>';
      return;
    }

    messages.slice().reverse().forEach((m) => {
      const card = document.createElement('div');
      card.className = 'msg-card' + (m.read ? ' read' : '');
      card.innerHTML = `
        <div class="msg-info">
          <div class="msg-sender">${esc(m.sender)}</div>
          <div class="msg-text">${esc(m.text)}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="msg-time">${m.time}</span>
          ${!m.read
            ? `<button onclick="markRead('${m.id}')" style="background:#1f4f23;border:none;border-radius:6px;color:#3fb950;padding:4px 10px;font-size:0.75rem;cursor:pointer">✓ Leído</button>`
            : `<span style="color:#3fb950;font-size:0.75rem">✓</span>`}
        </div>
      `;
      list.appendChild(card);
    });
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Speech synthesis ───────────────────────────────────────────────────────
  function readPendingMessages() {
    const pending = messages.filter(m => !m.read);
    setStatus('speaking', '🔊 Leyendo mensajes…');
    document.getElementById('mic-btn').classList.add('speaking');

    if (pending.length === 0) {
      speak('No tenés mensajes pendientes.', done);
      return;
    }

    speak(`Tenés ${pending.length} mensaje${pending.length > 1 ? 's' : ''} pendiente${pending.length > 1 ? 's' : ''}.`, () => {
      readNext(pending, 0);
    });
  }

  function readNext(list, i) {
    if (i >= list.length) { done(); return; }
    const m = list[i];
    speak(`Mensaje de ${m.sender}: ${m.text}`, () => {
      markRead(m.id);
      readNext(list, i + 1);
    });
  }

  function speak(text, cb) {
    synth.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'es-AR';
    utt.rate = 1;
    utt.onend = cb || null;
    synth.speak(utt);
  }

  function done() {
    document.getElementById('mic-btn').classList.remove('speaking');
    setStatus('active', '🎙 Escuchando… decí "mensaje"');
  }

  // ── Voice recognition ──────────────────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function initRecognition() {
    if (!SpeechRecognition) {
      setStatus('error', '⚠ Tu navegador no soporta reconocimiento de voz');
      return false;
    }
    recognition = new SpeechRecognition();
    recognition.lang = 'es-AR';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (e) => {
      let interim = '';
      let final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript.toLowerCase().trim();
        if (e.results[i].isFinal) final += t + ' ';
        else interim += t;
      }
      document.getElementById('transcript-box').textContent = (final || interim) || '…';

      if (final.includes('mensaje') || interim.includes('mensaje')) {
        if (!synth.speaking) readPendingMessages();
      }
    };

    recognition.onerror = (e) => {
      if (e.error === 'no-speech') return;
      setStatus('error', `Error: ${e.error}`);
    };

    recognition.onend = () => {
      if (listening) recognition.start();
    };

    return true;
  }

  function toggleListening() {
    if (!listening) {
      if (!recognition && !initRecognition()) return;
      listening = true;
      recognition.start();
      document.getElementById('mic-btn').classList.add('listening');
      document.getElementById('mic-icon').textContent = '⏹';
      setStatus('active', '🎙 Escuchando… decí "mensaje"');
    } else {
      listening = false;
      recognition.stop();
      document.getElementById('mic-btn').classList.remove('listening');
      document.getElementById('mic-icon').textContent = '🎤';
      setStatus('', 'Presioná el micrófono para empezar');
      document.getElementById('transcript-box').textContent = '…';
    }
  }

  function setStatus(cls, text) {
    const el = document.getElementById('status');
    el.className = cls;
    el.textContent = text;
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  document.getElementById('mic-btn').addEventListener('click', toggleListening);

  // Polling: estado cada 5s, mensajes cada 3s
  fetchStatus();
  fetchMessages();
  setInterval(fetchStatus, 5000);
  setInterval(fetchMessages, 3000);
</script>
</body>
</html>
